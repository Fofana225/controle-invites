<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Contrôle des invités</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    #reader {
      max-width: 500px;
      margin: 20px auto;
      background: white;
      padding: 10px;
      border-radius: 15px;
    }

    #resultat {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 15px;
      font-size: 18px;
    }

    .vert {
      color: #16803c;
    }

    .rouge {
      color: #c62828;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px 25px;
      font-size: 18px;
      background: #16803c;
      color: white;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>💍 Contrôle des invités</h1>

  <div id="reader"></div>

  <div id="resultat">
    📱 Scannez un QR code
  </div>

  <script>

    // =====================================================
    // IMPORTANT :
    // COLLE ICI L'URL DE TON APPLICATION WEB APPS SCRIPT
    // =====================================================

    const APP_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbw1GkpeeDBPEwT8zKbRnCTb21VfHJ_D127FWJGkSzc4tJD2v-kZPuSRMn9Hfn1cEKOW/exec";


    let dernierId = "";
    let scanEnCours = false;


    // -----------------------------------------------------
    // Recherche de l'invitation
    // -----------------------------------------------------

    function qrScanne(id) {

      if (scanEnCours) return;

      scanEnCours = true;
      dernierId = id;

      document.getElementById("resultat").innerHTML =
        "🔎 Recherche de l'invitation...";


      fetch(
        APP_SCRIPT_URL +
        "?action=chercher&id=" +
        encodeURIComponent(id)
      )

      .then(function(response) {
        return response.json();
      })

      .then(function(invite) {
        afficherInvite(invite);
      })

      .catch(function(erreur) {

        document.getElementById("resultat").innerHTML =
          "<div class='rouge'>" +
          "<h2>❌ ERREUR</h2>" +
          "<p>Impossible de contacter le système.</p>" +
          "</div>";

        scanEnCours = false;
      });
    }


    // -----------------------------------------------------
    // Affichage de l'invitation
    // -----------------------------------------------------

    function afficherInvite(invite) {

      if (!invite) {

        document.getElementById("resultat").innerHTML =
          "<div class='rouge'>" +
          "<h2>❌ QR CODE INCONNU</h2>" +
          "<p>Cette invitation n'existe pas.</p>" +
          "</div>";

        scanEnCours = false;
        return;
      }


      if (invite.entrees >= invite.nombre) {

        document.getElementById("resultat").innerHTML =
          "<div class='rouge'>" +
          "<h2>🔴 INVITATION COMPLÈTE</h2>" +
          "<p><strong>" +
          invite.prenom + " " +
          invite.nom +
          "</strong></p>" +
          "<p>" +
          invite.entrees +
          " / " +
          invite.nombre +
          " personnes déjà entrées</p>" +
          "</div>";

        scanEnCours = false;
        return;
      }


      document.getElementById("resultat").innerHTML =
        "<div class='vert'>" +

        "<h2>🟢 INVITATION TROUVÉE</h2>" +

        "<p><strong>" +
        invite.prenom + " " +
        invite.nom +
        "</strong></p>" +

        "<p>👥 " +
        invite.nombre +
        " personne(s) autorisée(s)</p>" +

        "<p>✅ " +
        invite.entrees +
        " déjà entrée(s)</p>" +

        "<p>🟢 " +
        invite.restant +
        " restante(s)</p>" +

        "<button onclick='validerEntree()'>" +
        "➕ ENREGISTRER UNE ENTRÉE" +
        "</button>" +

        "</div>";
    }


    // -----------------------------------------------------
    // Enregistrer une entrée
    // -----------------------------------------------------

    function validerEntree() {

      document.getElementById("resultat").innerHTML =
        "⏳ Enregistrement de l'entrée...";


      fetch(
        APP_SCRIPT_URL +
        "?action=enregistrer&id=" +
        encodeURIComponent(dernierId)
      )

      .then(function(response) {
        return response.json();
      })

      .then(function(resultat) {

        if (resultat.success) {

          document.getElementById("resultat").innerHTML =
            "<div class='vert'>" +

            "<h2>✅ ENTRÉE ENREGISTRÉE</h2>" +

            "<p>" +
            resultat.entrees +
            " / " +
            resultat.nombre +
            " personnes entrées</p>" +

            "<p>🟢 Il reste " +
            resultat.restant +
            " personne(s)</p>" +

            "</div>";

        } else {

          document.getElementById("resultat").innerHTML =
            "<div class='rouge'>" +

            "<h2>🔴 " +
            resultat.message +
            "</h2>" +

            "</div>";
        }


        setTimeout(function() {

          scanEnCours = false;

          document.getElementById("resultat").innerHTML =
            "📱 Prêt pour le prochain invité";

        }, 3000);

      })

      .catch(function() {

        document.getElementById("resultat").innerHTML =
          "<div class='rouge'>" +
          "❌ Impossible d'enregistrer l'entrée" +
          "</div>";

        scanEnCours = false;

      });
    }


    // -----------------------------------------------------
    // Démarrage du scanner
    // -----------------------------------------------------

    function demarrerScanner() {

      const scanner =
        new Html5QrcodeScanner(
          "reader",
          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },
          false
        );


      scanner.render(

        function(decodedText) {

          qrScanne(decodedText);

        },

        function(errorMessage) {

          // Les erreurs normales de lecture
          // sont ignorées.

        }
      );
    }


    demarrerScanner();

  </script>

</body>
</html>
